name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: App, tests, and bundle
    # Self-hosted Apple Silicon Mac minis. Intel coverage runs under Rosetta.
    runs-on: [self-hosted, macOS, ARM64, macmini]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Export canonical bundle metadata
        run: ./scripts/export-canonical-metadata.sh

      - name: Verify runner architecture, Rosetta, and toolchain
        run: |
          test "$(uname -m)" = "arm64"
          test "$(/usr/bin/arch -x86_64 /usr/bin/uname -m)" = "x86_64"
          sw_vers
          xcodebuild -version
          swift --version
          xcode_version="$(xcodebuild -version | sed -n '1s/^Xcode //p')"
          test -n "$xcode_version"
          echo "DICTATE_XCODE_VERSION=$xcode_version" >> "$GITHUB_ENV"
          # Per-job tool directory: runners that share a host and home
          # directory must not race on one install location.
          echo "DICTATE_CI_TOOL_CACHE=$RUNNER_TEMP/dictate-tools" >> "$GITHUB_ENV"

      - name: Restore explicit SwiftPM and tool caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Dictate/.build
            ${{ runner.temp }}/dictate-tools
          key: dictate-v2-${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.DICTATE_XCODE_VERSION }}-${{ hashFiles('Dictate/Package.swift', 'Dictate/Package.resolved') }}
          restore-keys: |
            dictate-v2-${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.DICTATE_XCODE_VERSION }}-

      - name: Install digest-pinned lint tools
        run: |
          tool_bin="$(./scripts/install-ci-tools.sh)"
          echo "$tool_bin" >> "$GITHUB_PATH"

      - name: Validate shell, plist, version, lint, and format policy
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find . -type f -name '*.sh' -not -path './Dictate/.build/*' -print0)
          plutil -lint Dictate/Info.plist Dictate/Dictate.entitlements
          if /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Dictate/Info.plist >/dev/null 2>&1; then
            echo 'Dictate/Info.plist must not duplicate VERSION' >&2
            exit 1
          fi
          ./scripts/read-version.sh
          swiftlint lint --strict --config .swiftlint.yml
          swiftformat --lint --config .swiftformat Dictate/Sources Dictate/Tests

      - name: Build debug and release for every supported architecture
        run: |
          for configuration in debug release; do
            for architecture in arm64 x86_64; do
              swift build \
                --package-path Dictate \
                --configuration "$configuration" \
                --triple "$architecture-apple-macosx$DICTATE_MINIMUM_SYSTEM_VERSION" \
                --scratch-path "Dictate/.build/$configuration-$architecture" \
                -Xswiftc -warnings-as-errors
            done
          done

      - name: Run all tests natively and under Rosetta
        run: |
          swift test \
            --package-path Dictate \
            --configuration debug \
            --triple "arm64-apple-macosx$DICTATE_MINIMUM_SYSTEM_VERSION" \
            --scratch-path Dictate/.build/tests-arm64 \
            -Xswiftc -warnings-as-errors
          # The whole toolchain runs translated so the x86_64 test bundle
          # loads. SwiftPM's Swift Testing helper always launches natively and
          # cannot load it, so that library is covered by the arm64 run above.
          /usr/bin/arch -x86_64 swift test \
            --package-path Dictate \
            --configuration debug \
            --triple "x86_64-apple-macosx$DICTATE_MINIMUM_SYSTEM_VERSION" \
            --scratch-path Dictate/.build/tests-x86_64 \
            --disable-swift-testing \
            -Xswiftc -warnings-as-errors
          bash tests/dependency-tool-fixtures.sh

      - name: Assemble and verify extracted deterministic test bundle
        run: |
          fixture_dir="$RUNNER_TEMP/dictate-model-fixture"
          python3 tests/create-parakeet-fixture.py "$fixture_dir"
          export DICTATE_MODEL_MANIFEST="$fixture_dir/manifest.json"
          export DICTATE_MODEL_PATH="$fixture_dir/parakeet-ultra-coreml"
          DICTATE_SIGNING_MODE=adhoc ./bundle.sh
          archive="$RUNNER_TEMP/$DICTATE_BUNDLE_NAME-ci.zip"
          extracted="$RUNNER_TEMP/extracted"
          ditto -c -k --sequesterRsrc --keepParent "$DICTATE_BUNDLE_NAME.app" "$archive"
          mkdir -p "$extracted"
          ditto -x -k "$archive" "$extracted"
          DICTATE_EXPECTED_SIGNATURE=adhoc DICTATE_X86_64_SMOKE_TEST=1 \
            ./scripts/verify-bundle.sh "$extracted/$DICTATE_BUNDLE_NAME.app"

  backend-contract:
    name: Parakeet backend (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x86_64
          - arm64
    # Self-hosted Apple Silicon Mac minis. The x86_64 leg runs under Rosetta.
    runs-on: [self-hosted, macOS, ARM64, macmini]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Export canonical bundle metadata
        run: ./scripts/export-canonical-metadata.sh

      - name: Verify runner architecture, Rosetta, and toolchain
        run: |
          test "$(uname -m)" = "arm64"
          test "$(/usr/bin/arch -x86_64 /usr/bin/uname -m)" = "x86_64"
          sw_vers
          xcodebuild -version
          swift --version

      - name: Restore reviewed Parakeet weights
        if: matrix.architecture == 'arm64'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: dictate-parakeet-ultra-${{ hashFiles('Dictate/Sources/Dictate/Resources/parakeet-model.json') }}

      - name: Install and verify the pinned production model
        if: matrix.architecture == 'arm64'
        run: ./scripts/dependency-tool.sh install-model

      - name: Exercise Parakeet inference or unsupported-hardware preflight
        env:
          DICTATE_PARAKEET_SMOKE_TEST: '1'
          DICTATE_TEST_AUDIO: ${{ github.workspace }}/tests/fixtures/jfk.wav
        run: |
          if [[ "${{ matrix.architecture }}" == 'arm64' ]]; then
            swift test --package-path Dictate \
              --triple "arm64-apple-macosx$DICTATE_MINIMUM_SYSTEM_VERSION" \
              --scratch-path Dictate/.build/parakeet-arm64 \
              --filter ParakeetIntegrationTests -Xswiftc -warnings-as-errors
          else
            # SwiftPM's --filter lists tests with a helper that always launches
            # natively and cannot load an x86_64 bundle, so run the translated
            # XCTest suite unfiltered and require that the Intel guard ran.
            log="$RUNNER_TEMP/intel-guard.log"
            /usr/bin/arch -x86_64 swift test --package-path Dictate \
              --triple "x86_64-apple-macosx$DICTATE_MINIMUM_SYSTEM_VERSION" \
              --scratch-path Dictate/.build/parakeet-x86_64 \
              --disable-swift-testing -Xswiftc -warnings-as-errors 2>&1 | tee "$log"
            grep -F "testIntelPreflightRejectsUnsupportedHardwareBeforeLoadingModels]' passed" "$log"
          fi

  required:
    name: Required
    if: ${{ always() }}
    needs:
      - quality
      - backend-contract
    runs-on: [self-hosted, macOS, ARM64, macmini]
    steps:
      - name: Require every macOS gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BACKEND_RESULT: ${{ needs.backend-contract.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$BACKEND_RESULT" = success
