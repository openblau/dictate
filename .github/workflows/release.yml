name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  quality:
    name: Required quality gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Sign, notarize, verify, and publish
    needs:
      - quality
    # Self-hosted Apple Silicon Mac mini. The Universal 2 bundle is
    # cross-compiled and its x86_64 slice is smoke-tested under Rosetta.
    runs-on: [self-hosted, macOS, ARM64, macmini]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out exact tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Export canonical bundle metadata
        run: ./scripts/export-canonical-metadata.sh

      - name: Verify runner architecture, Rosetta, and toolchain
        run: |
          test "$(uname -m)" = "arm64"
          test "$(/usr/bin/arch -x86_64 /usr/bin/uname -m)" = "x86_64"
          sw_vers
          xcodebuild -version
          xcode_version="$(xcodebuild -version | sed -n '1s/^Xcode //p')"
          test -n "$xcode_version"
          echo "DICTATE_XCODE_VERSION=$xcode_version" >> "$GITHUB_ENV"

      - name: Restore explicit SwiftPM cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Dictate/.build
          key: dictate-v2-${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.DICTATE_XCODE_VERSION }}-${{ hashFiles('Dictate/Package.swift', 'Dictate/Package.resolved') }}
          restore-keys: |
            dictate-v2-${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.DICTATE_XCODE_VERSION }}-

      - name: Restore digest-keyed model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: dictate-model-v1-${{ hashFiles('Dictate/Sources/Dictate/Resources/parakeet-model.json') }}

      - name: Install or verify the pinned production model
        run: ./scripts/dependency-tool.sh install-model

      - name: Import Developer ID certificate into an ephemeral keychain
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          : "${MACOS_CERTIFICATE_BASE64:?missing MACOS_CERTIFICATE_BASE64}"
          : "${MACOS_CERTIFICATE_PASSWORD:?missing MACOS_CERTIFICATE_PASSWORD}"
          : "${MACOS_SIGNING_IDENTITY:?missing MACOS_SIGNING_IDENTITY}"

          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/dictate-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          if printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$certificate_path" 2>/dev/null; then
            :
          else
            printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          fi
          # The runner account outlives this job, so record its keychain
          # search list and default keychain for the cleanup step to restore.
          security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//' \
            > "$RUNNER_TEMP/original-keychains.txt"
          security default-keychain -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//' \
            > "$RUNNER_TEMP/original-default-keychain.txt" || true
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F "\"$MACOS_SIGNING_IDENTITY\""
          rm -f "$certificate_path"

          echo "DICTATE_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple, and archive
        env:
          DICTATE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          DICTATE_RELEASE_TAG: ${{ github.ref_name }}
          DICTATE_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          : "${APPLE_ID:?missing APPLE_ID}"
          : "${APPLE_TEAM_ID:?missing APPLE_TEAM_ID}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?missing APPLE_APP_SPECIFIC_PASSWORD}"
          ./release.sh

      - name: Create draft release and upload verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          DICTATE_RELEASE_TAG: ${{ github.ref_name }}
          DICTATE_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          source dependencies.env
          version="$(./scripts/read-version.sh)"
          zip_name="$DICTATE_BUNDLE_NAME-$version.zip"
          release_preamble="$(printf '%s\n\n%s\n\n%s' \
            "This release is a notarized Universal 2 build for Apple Silicon and Intel Macs running macOS $DICTATE_MINIMUM_SYSTEM_VERSION or newer." \
            "Pinned Parakeet model: $MODEL_REPOSITORY@$MODEL_REVISION; file digests are in the reviewed model manifest." \
            "Built-in transcription backend: FluidAudio $BACKEND_VERSION.")"
          ./release.sh verify-source
          gh release create "$GITHUB_REF_NAME" \
            "dist/$zip_name" \
            "dist/$zip_name.sha256" \
            --draft \
            --verify-tag \
            --title "$DICTATE_BUNDLE_NAME $version" \
            --generate-notes \
            --notes "$release_preamble"

      - name: Download and verify the exact draft asset
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          version="$(./scripts/read-version.sh)"
          zip_name="$DICTATE_BUNDLE_NAME-$version.zip"
          download_dir="$RUNNER_TEMP/downloaded-release"
          extracted_dir="$RUNNER_TEMP/downloaded-release-extracted"
          mkdir -p "$download_dir" "$extracted_dir"
          gh release download "$GITHUB_REF_NAME" --pattern "$zip_name" --dir "$download_dir"
          (cd "$download_dir" && shasum -a 256 -c "$GITHUB_WORKSPACE/dist/$zip_name.sha256")
          ditto -x -k "$download_dir/$zip_name" "$extracted_dir"
          DICTATE_EXPECTED_SIGNATURE=developer-id \
          DICTATE_EXPECTED_TEAM_ID="$APPLE_TEAM_ID" \
          DICTATE_REQUIRE_NOTARIZATION=1 \
          DICTATE_X86_64_SMOKE_TEST=1 \
            ./scripts/verify-bundle.sh "$extracted_dir/$DICTATE_BUNDLE_NAME.app"

      - name: Publish only after downloaded-asset verification
        env:
          GH_TOKEN: ${{ github.token }}
          DICTATE_RELEASE_TAG: ${{ github.ref_name }}
          DICTATE_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          ./release.sh verify-source
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      - name: Delete ephemeral keychain and restore the runner's keychains
        if: ${{ always() }}
        run: |
          if [[ -s "$RUNNER_TEMP/original-keychains.txt" ]]; then
            original_keychains=()
            while IFS= read -r keychain; do
              [[ -n "$keychain" ]] && original_keychains+=("$keychain")
            done < "$RUNNER_TEMP/original-keychains.txt"
            security list-keychains -d user -s "${original_keychains[@]}"
          fi
          if [[ -s "$RUNNER_TEMP/original-default-keychain.txt" ]]; then
            security default-keychain -d user \
              -s "$(sed -n '1p' "$RUNNER_TEMP/original-default-keychain.txt")"
          fi
          if [[ -n "${DICTATE_KEYCHAIN:-}" && -f "$DICTATE_KEYCHAIN" ]]; then
            security delete-keychain "$DICTATE_KEYCHAIN"
          fi
